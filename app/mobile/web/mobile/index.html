<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f4fb">
  <title>햄보드</title>
  <link rel="stylesheet" href="./mobile.css">
</head>
<body>
  <div class="mobile-app" id="mobileApp">
    <header class="mobile-topbar">
      <button class="icon-button" id="mobileBack" type="button" aria-label="이전 화면으로" hidden>
        <i data-lucide="arrow-left" aria-hidden="true"></i>
      </button>
      <div class="mobile-heading"><h1 id="mobileTitle">홈</h1></div>
      <div class="sync-status-wrap" id="syncStatusWrap">
        <button class="sync-indicator" id="syncIndicator" data-state="local" type="button">로그인</button>
        <div class="offline-warning" id="offlineWarning" role="status" hidden>오프라인에서 편집하면 동기화 충돌이 생길 수 있습니다. 작업을 마치기 전에 온라인 상태에서 한 번 동기화하거나 백업해 주세요.</div>
      </div>
    </header>

    <main class="mobile-main">
      <section id="libraryScreen" class="mobile-screen" aria-labelledby="mobileTitle">
        <label class="home-search-field">
          <i data-lucide="search" aria-hidden="true"></i>
          <input id="librarySearch" type="search" placeholder="문서 검색" autocomplete="off">
        </label>
        <div id="libraryStatus" class="status-card" role="status">문서 데이터를 확인하고 있습니다.</div>
        <div id="libraryList" class="library-list"></div>
      </section>

      <section id="projectReaderScreen" class="mobile-screen" hidden>
        <article class="document-hero">
          <span class="document-kind" id="readerKind"></span>
          <h2 id="readerTitle"></h2>
          <p id="readerSubtitle"></p>
          <div class="document-meta" id="readerMeta"></div>
        </article>
        <div id="episodeList" class="episode-list"></div>
        <div id="projectContent" class="project-content"></div>
      </section>

      <section id="noteReaderScreen" class="mobile-screen" hidden>
        <article class="document-hero">
          <span class="document-kind">노트</span>
          <h2 id="noteReaderTitle"></h2>
          <p id="noteReaderSubtitle"></p>
          <div class="document-meta" id="noteReaderMeta"></div>
        </article>
        <article class="note-reader-card" id="noteReaderContent"></article>
      </section>

      <section id="mindmapReaderScreen" class="mobile-screen" hidden>
        <article class="document-hero">
          <span class="document-kind">마인드맵</span>
          <h2 id="mindmapReaderTitle"></h2>
          <p id="mindmapReaderSubtitle"></p>
          <div class="document-meta" id="mindmapReaderMeta"></div>
        </article>
        <div class="mindmap-reader-scroll" id="mindmapReaderScroll">
          <div class="mindmap-reader-canvas" id="mindmapReaderCanvas">
            <svg id="mindmapReaderEdges" aria-hidden="true"></svg>
            <div id="mindmapReaderNodes"></div>
          </div>
        </div>
      </section>

      <section id="menuScreen" class="mobile-screen page-screen" hidden>
        <div class="page-menu-list">
          <button id="menuCloud" type="button">
            <span class="page-menu-icon"><i data-lucide="cloud" aria-hidden="true"></i></span>
            <span class="page-menu-copy"><strong>클라우드</strong><small>계정 연결과 데이터 불러오기를 관리합니다.</small></span>
            <i data-lucide="chevron-right" aria-hidden="true"></i>
          </button>
          <button type="button" disabled>
            <span class="page-menu-icon"><i data-lucide="settings" aria-hidden="true"></i></span>
            <span class="page-menu-copy"><strong>설정</strong><small>모바일 햄보드 설정을 관리합니다.</small></span>
            <i data-lucide="chevron-right" aria-hidden="true"></i>
          </button>
        </div>
      </section>

      <section id="cloudSourceScreen" class="mobile-screen page-screen" hidden>
        <div class="cloud-account-card">
          <span class="cloud-account-icon"><i data-lucide="cloud-check" aria-hidden="true"></i></span>
          <span class="cloud-account-copy"><strong>계정 연결됨</strong><small>클라우드에 저장된 데이터를 선택해서 불러올 수 있습니다.</small></span>
          <button id="cloudDisconnect" type="button">연결 해제</button>
        </div>

        <div class="cloud-source-status" id="cloudSourceStatus" role="status">불러올 데이터를 확인하고 있습니다.</div>

        <section class="cloud-source-card">
          <div class="cloud-source-head">
            <span class="cloud-source-icon"><i data-lucide="refresh-cw" aria-hidden="true"></i></span>
            <div><h2>동기화 데이터</h2><p>PC에서 자동으로 동기화된 최신 상태를 불러옵니다.</p></div>
          </div>
          <div class="cloud-source-meta" id="syncSourceMeta">확인 중…</div>
          <button class="cloud-source-primary" id="loadSyncSource" type="button" disabled>동기화 데이터 불러오기</button>
        </section>

        <section class="cloud-source-card">
          <div class="cloud-source-head">
            <span class="cloud-source-icon"><i data-lucide="archive" aria-hidden="true"></i></span>
            <div><h2>수동 백업</h2><p>PC에서 직접 만든 백업 중 원하는 시점을 선택합니다.</p></div>
          </div>
          <div class="backup-source-list" id="backupSourceList"></div>
        </section>
      </section>
    </main>

    <nav class="mobile-bottom-nav" aria-label="주요 탐색">
      <button class="bottom-nav-button active" id="libraryNav" type="button" aria-label="홈">
        <span class="bottom-nav-icon"><i data-lucide="library" aria-hidden="true"></i></span>
        <span>홈</span>
      </button>
      <button class="bottom-nav-button bottom-nav-create" id="createNav" type="button" aria-label="새 문서">
        <span class="bottom-nav-icon"><i data-lucide="plus" aria-hidden="true"></i></span>
        <span>새 문서</span>
      </button>
      <button class="bottom-nav-button" id="menuNav" type="button" aria-label="메뉴">
        <span class="bottom-nav-icon"><i data-lucide="menu" aria-hidden="true"></i></span>
        <span>메뉴</span>
      </button>
    </nav>
  </div>

  <div class="nav-sheet-backdrop" id="createSheet" hidden>
    <section class="nav-sheet" role="dialog" aria-modal="true" aria-labelledby="createSheetTitle">
      <div class="nav-sheet-handle" aria-hidden="true"></div>
      <header class="nav-sheet-header"><h2 id="createSheetTitle">새 문서</h2><button class="sheet-close" id="createSheetClose" type="button" aria-label="닫기"><i data-lucide="x" aria-hidden="true"></i></button></header>
      <div class="create-grid" aria-label="생성할 항목">
        <button type="button" disabled><i data-lucide="folder-plus" aria-hidden="true"></i><span><strong>폴더</strong><small>다음 단계에서 연결</small></span></button>
        <button type="button" disabled><i data-lucide="scroll-text" aria-hidden="true"></i><span><strong>작품</strong><small>다음 단계에서 연결</small></span></button>
        <button type="button" disabled><i data-lucide="notebook-text" aria-hidden="true"></i><span><strong>노트</strong><small>다음 단계에서 연결</small></span></button>
        <button type="button" disabled><i data-lucide="network" aria-hidden="true"></i><span><strong>마인드맵</strong><small>다음 단계에서 연결</small></span></button>
      </div>
    </section>
  </div>

  <input id="mobileDataFile" type="file" accept="application/json,.json" hidden>
  <script src="../shared/sync-state-model.js"></script>
  <script src="../shared/project-repository.js"></script>
  <script src="../../../window/web/assets/vendor/lucide/lucide.min.js"></script>
  <script src="./mobile-google-drive.js"></script>
  <script src="./mobile-app.js"></script>
</body>
</html>
