<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f4fb">
  <title>햄보드</title>
  <link rel="stylesheet" href="./mobile.css">
</head>
<body>
  <div class="mobile-app" id="mobileApp">
    <header class="mobile-topbar">
      <button class="icon-button" id="mobileBack" type="button" aria-label="보관함으로 돌아가기" hidden>
        <i data-lucide="arrow-left" aria-hidden="true"></i>
      </button>
      <div class="mobile-heading"><span class="mobile-eyebrow">HAMBOARD</span><h1 id="mobileTitle">보관함</h1></div>
      <button class="sync-indicator" id="syncIndicator" data-state="local" type="button">로그인</button>
    </header>

    <main class="mobile-main">
      <section id="libraryScreen" class="mobile-screen" aria-labelledby="mobileTitle">
        <div id="libraryStatus" class="status-card" role="status">문서 데이터를 확인하고 있습니다.</div>
        <div id="libraryList" class="library-list"></div>
      </section>

      <section id="projectReaderScreen" class="mobile-screen" hidden>
        <article class="document-hero">
          <span class="document-kind" id="readerKind"></span>
          <h2 id="readerTitle"></h2>
          <p id="readerSubtitle"></p>
          <div class="document-meta" id="readerMeta"></div>
        </article>
        <div id="episodeList" class="episode-list"></div>
        <div id="projectContent" class="project-content"></div>
      </section>

      <section id="noteReaderScreen" class="mobile-screen" hidden>
        <article class="document-hero">
          <span class="document-kind">노트</span>
          <h2 id="noteReaderTitle"></h2>
          <p id="noteReaderSubtitle"></p>
          <div class="document-meta" id="noteReaderMeta"></div>
        </article>
        <article class="note-reader-card" id="noteReaderContent"></article>
      </section>

      <section id="mindmapReaderScreen" class="mobile-screen" hidden>
        <article class="document-hero">
          <span class="document-kind">마인드맵</span>
          <h2 id="mindmapReaderTitle"></h2>
          <p id="mindmapReaderSubtitle"></p>
          <div class="document-meta" id="mindmapReaderMeta"></div>
        </article>
        <div class="mindmap-reader-scroll" id="mindmapReaderScroll">
          <div class="mindmap-reader-canvas" id="mindmapReaderCanvas">
            <svg id="mindmapReaderEdges" aria-hidden="true"></svg>
            <div id="mindmapReaderNodes"></div>
          </div>
        </div>
      </section>
    </main>

    <nav class="mobile-bottom-nav" aria-label="주요 탐색">
      <button class="bottom-nav-button active" id="libraryNav" type="button" aria-label="보관함">
        <i data-lucide="library" aria-hidden="true"></i>
        <span>보관함</span>
      </button>
      <button class="bottom-nav-create" id="createNav" type="button" aria-label="새로 만들기">
        <i data-lucide="plus" aria-hidden="true"></i>
      </button>
      <button class="bottom-nav-button" id="menuNav" type="button" aria-label="메뉴">
        <i data-lucide="menu" aria-hidden="true"></i>
        <span>메뉴</span>
      </button>
    </nav>
  </div>

  <div class="nav-sheet-backdrop" id="createSheet" hidden>
    <section class="nav-sheet" role="dialog" aria-modal="true" aria-labelledby="createSheetTitle">
      <div class="nav-sheet-handle" aria-hidden="true"></div>
      <header class="nav-sheet-header"><div><span>NEW</span><h2 id="createSheetTitle">새로 만들기</h2></div><button class="sheet-close" id="createSheetClose" type="button" aria-label="닫기"><i data-lucide="x" aria-hidden="true"></i></button></header>
      <div class="create-grid" aria-label="생성할 항목">
        <button type="button" disabled><i data-lucide="folder-plus" aria-hidden="true"></i><span><strong>폴더</strong><small>다음 단계에서 연결</small></span></button>
        <button type="button" disabled><i data-lucide="scroll-text" aria-hidden="true"></i><span><strong>작품</strong><small>다음 단계에서 연결</small></span></button>
        <button type="button" disabled><i data-lucide="notebook-text" aria-hidden="true"></i><span><strong>노트</strong><small>다음 단계에서 연결</small></span></button>
        <button type="button" disabled><i data-lucide="network" aria-hidden="true"></i><span><strong>마인드맵</strong><small>다음 단계에서 연결</small></span></button>
      </div>
    </section>
  </div>

  <div class="nav-sheet-backdrop" id="mainMenuSheet" hidden>
    <section class="nav-sheet" role="dialog" aria-modal="true" aria-labelledby="mainMenuTitle">
      <div class="nav-sheet-handle" aria-hidden="true"></div>
      <header class="nav-sheet-header"><div><span>HAMBOARD</span><h2 id="mainMenuTitle">메뉴</h2></div><button class="sheet-close" id="mainMenuClose" type="button" aria-label="닫기"><i data-lucide="x" aria-hidden="true"></i></button></header>
      <div class="main-menu-list">
        <button id="menuSearch" type="button"><i data-lucide="search" aria-hidden="true"></i><span><strong>검색</strong><small>보관함 전체에서 찾기</small></span><i data-lucide="chevron-right" aria-hidden="true"></i></button>
        <button id="menuCloud" type="button"><i data-lucide="cloud-download" aria-hidden="true"></i><span><strong>클라우드 동기화</strong><small>Google Drive 연결 및 불러오기</small></span><i data-lucide="chevron-right" aria-hidden="true"></i></button>
        <button type="button" disabled><i data-lucide="settings" aria-hidden="true"></i><span><strong>설정</strong><small>다음 단계에서 구성</small></span><i data-lucide="chevron-right" aria-hidden="true"></i></button>
      </div>
    </section>
  </div>

  <div class="nav-sheet-backdrop" id="searchSheet" hidden>
    <section class="nav-sheet search-sheet" role="dialog" aria-modal="true" aria-labelledby="searchSheetTitle">
      <div class="nav-sheet-handle" aria-hidden="true"></div>
      <header class="nav-sheet-header"><div><span>SEARCH</span><h2 id="searchSheetTitle">검색</h2></div><button class="sheet-close" id="searchSheetClose" type="button" aria-label="닫기"><i data-lucide="x" aria-hidden="true"></i></button></header>
      <label class="search-field">
        <i data-lucide="search" aria-hidden="true"></i>
        <input id="librarySearch" type="search" placeholder="작품, 노트, 마인드맵 검색" autocomplete="off">
      </label>
      <div class="search-results" id="searchResults"></div>
    </section>
  </div>

  <div class="cloud-sheet-backdrop" id="cloudSheet" hidden>
    <section class="cloud-sheet" role="dialog" aria-modal="true" aria-labelledby="cloudSheetTitle">
      <div class="cloud-sheet-handle" aria-hidden="true"></div>
      <header><div><span>GOOGLE DRIVE</span><h2 id="cloudSheetTitle">클라우드 연결</h2></div><button id="cloudSheetClose" type="button" aria-label="닫기"><i data-lucide="x" aria-hidden="true"></i></button></header>
      <p id="cloudSheetMessage">PC에서 동기화한 햄보드 데이터를 같은 Google 계정으로 불러옵니다.</p>
      <div class="cloud-actions">
        <button class="cloud-secondary" id="cloudDisconnect" type="button" hidden>연결 해제</button>
        <button class="cloud-primary" id="cloudConnect" type="button">Google로 로그인</button>
      </div>
    </section>
  </div>

  <input id="mobileDataFile" type="file" accept="application/json,.json" hidden>
  <script src="../shared/sync-state-model.js"></script>
  <script src="../shared/project-repository.js"></script>
  <script src="../../../window/web/assets/vendor/lucide/lucide.min.js"></script>
  <script src="./mobile-google-drive.js"></script>
  <script src="./mobile-app.js"></script>
</body>
</html>
